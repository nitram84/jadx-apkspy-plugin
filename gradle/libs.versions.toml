[versions]
annotations = "26.1.0"
jadx = "1.5.6"
rsyntax = "3.6.1"
commons_lang3 = "3.20.0"
commons_io = "2.22.0"
logback = "1.5.38"
asm = "9.10.1"
apktool = "3.0.3"
dex2jar = "2.4.38"
javaparser = "3.28.2"
assertj = "3.27.7"
junit = "6.1.3"
shadow = "9.6.1"
spotless = "8.10.0"
use_latest_versions = "0.2.19"
ben_manes_versions = "0.61.0"

[libraries]
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
jadx-cli = { module = "io.github.skylot:jadx-cli", version.ref = "jadx" }
jadx-core = { module = "io.github.skylot:jadx-core", version.ref = "jadx" }
jadx-gui = { module = "io.github.skylot:jadx-gui", version.ref = "jadx" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version.ref = "rsyntax" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons_lang3" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons_io" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
apktool-lib = { module = "org.apktool:apktool-lib", version.ref = "apktool" }
dex-tools = { module = "de.femtopedia.dex2jar:dex-tools", version.ref = "dex2jar" }
javaparser = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
use-latest-versions = { id = "se.patrikerdes.use-latest-versions", version.ref = "use_latest_versions" }
ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "ben_manes_versions" }
